version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: ai-doc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_documents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: ai-doc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-doc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","q","ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      




volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  
  


