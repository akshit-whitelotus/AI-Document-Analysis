[project]
name = "ai-document-analysis"
version = "0.1.0"
description = "Production Ready AI Document Analysis Platform"
requires-python = ">=3.12"

dependencies = [

    # FastAPI
    "fastapi",
    "uvicorn[standard]",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",

    # Validation
    "pydantic>=2",
    "pydantic-settings",
    "pydantic[email]",

   # Authentication
    "python-jose[cryptography]",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",

    # File Upload
    "python-multipart",

    # HTTP Client
    "httpx",

    # Retry
    "tenacity",

    # PDF
    "pymupdf",

    # AI
    "sentence-transformers",

    # Vector Database
    "faiss-cpu",

    # Celery
    "celery",

    # RabbitMQ
    "aio-pika",

    # Redis
    "redis",

    # Environment
    "python-dotenv",

    # Logging
    "structlog",

    "psycopg2-binary==2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]