<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Document Analysis Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: {
              850: '#1f1f1f',
              900: '#171717',
              950: '#0d0d0d',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, React DOM, and Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar styling for high-density SaaS look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }
  </style>
</head>
<body class="h-full bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased font-sans transition-colors duration-150">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // CONFIGURATION
    const API_BASE_URL = window.API_BASE_URL || 'http://localhost:8000/api/v1';
    const WS_BASE_URL = window.WS_BASE_URL || 'ws://localhost:8000/api/v1';

    // UTILS & STORAGE
    const getToken = () => localStorage.getItem('access_token');
    const getRefreshToken = () => localStorage.getItem('refresh_token');
    const setTokens = (access, refresh) => {
      localStorage.setItem('access_token', access);
      localStorage.setItem('refresh_token', refresh);
    };
    const clearTokens = () => {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
    };

    // GENERATE OR RETRIEVE SESSION ID
    const getSessionId = () => {
      let sid = localStorage.getItem('chat_session_id');
      if (!sid) {
        sid = crypto.randomUUID ? crypto.randomUUID() : 'session_' + Math.random().toString(36).substring(2);
        localStorage.setItem('chat_session_id', sid);
      }
      return sid;
    };

    // API CLIENT WITH AUTOMATIC REFRESH AND RETRY
    async function apiFetch(endpoint, options = {}, isRetry = false) {
      const token = getToken();
      const headers = { ...options.headers };

      if (token && !headers['Authorization']) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      if (options.body && !(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }

      const response = await fetch(`${API_BASE_URL}${endpoint}`, {
        ...options,
        headers,
      });

      if (response.status === 401 && !isRetry) {
        const refreshToken = getRefreshToken();
        if (refreshToken) {
          try {
            const refreshRes = await fetch(`${API_BASE_URL}/auth/refresh`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh_token: refreshToken }),
            });

            if (refreshRes.ok) {
              const data = await refreshRes.json();
              setTokens(data.access_token, data.refresh_token);
              // Retry original request
              headers['Authorization'] = `Bearer ${data.access_token}`;
              return fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
            }
          } catch (e) {
            console.error('Failed to refresh token:', e);
          }
        }
        clearTokens();
        window.dispatchEvent(new Event('auth-expired'));
      }

      return response;
    }

    // MAIN APPLICATION COMPONENT
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'dark');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [toast, setToast] = useState(null);

      // Apply theme
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const showToast = (message, type = 'error') => {
        setToast({ message, type });
      };

      // Load user profile on mount
      const fetchProfile = useCallback(async () => {
        if (!getToken()) {
          setAuthLoading(false);
          return;
        }
        try {
          const res = await apiFetch('/auth/me');
          if (res.ok) {
            const data = await res.json();
            setUser(data);
          } else {
            clearTokens();
            setUser(null);
          }
        } catch (err) {
          showToast('Network error while fetching profile');
          clearTokens();
          setUser(null);
        } finally {
          setAuthLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchProfile();
        const handleAuthExpired = () => {
          setUser(null);
          showToast('Session expired. Please log in again.', 'info');
        };
        window.addEventListener('auth-expired', handleAuthExpired);
        return () => window.removeEventListener('auth-expired', handleAuthExpired);
      }, [fetchProfile]);

      const handleLogout = async () => {
        try {
          await apiFetch('/auth/logout', { method: 'POST' });
        } catch (e) {
          // ignore error
        }
        clearTokens();
        setUser(null);
      };

      if (authLoading) {
        return (
          <div className="flex h-screen w-screen items-center justify-center bg-neutral-950 text-neutral-400">
            <div className="flex items-center space-x-2">
              <svg className="animate-spin h-5 w-5 text-neutral-200" viewBox="0 0 24 24" fill="none">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              <span>Loading workspace...</span>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col">
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded border text-xs font-medium shadow-lg transition-all flex items-center justify-between space-x-3 ${
              toast.type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' : 'bg-neutral-900/90 text-neutral-200 border-neutral-700'
            }`}>
              <span>{toast.message}</span>
              <button onClick={() => setToast(null)} className="text-neutral-400 hover:text-white">&times;</button>
            </div>
          )}

          {!user ? (
            <AuthScreen onAuthSuccess={() => fetchProfile()} showToast={showToast} />
          ) : (
            <MainDashboard user={user} onLogout={handleLogout} toggleTheme={toggleTheme} theme={theme} showToast={showToast} />
          )}
        </div>
      );
    }

    // AUTH SCREEN (LOGIN & REGISTER)
    function AuthScreen({ onAuthSuccess, showToast }) {
      const [isLogin, setIsLogin] = useState(true);
      const [formData, setFormData] = useState({
        first_name: '',
        last_name: '',
        username: '',
        email: '',
        password: ''
      });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        if (!isLogin && formData.password.length < 8) {
          setError('Password must be at least 8 characters long');
          return;
        }

        setLoading(true);

        try {
          if (isLogin) {
            const res = await fetch(`${API_BASE_URL}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: formData.email, password: formData.password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Invalid login credentials');
            setTokens(data.access_token, data.refresh_token);
            onAuthSuccess();
          } else {
            const res = await fetch(`${API_BASE_URL}/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Registration failed');
            // Auto login after register
            const loginRes = await fetch(`${API_BASE_URL}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: formData.email, password: formData.password }),
            });
            const loginData = await loginRes.json();
            if (loginRes.ok) {
              setTokens(loginData.access_token, loginData.refresh_token);
              onAuthSuccess();
            } else {
              setIsLogin(true);
              showToast('Account created. Please log in.');
            }
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex h-full items-center justify-center bg-neutral-100 dark:bg-neutral-950 px-4">
          <div className="w-full max-w-md bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg p-6 shadow-sm">
            <div className="mb-6">
              <h1 className="text-xl font-semibold tracking-tight">AI Document Engine</h1>
              <p className="text-xs text-neutral-500 dark:text-neutral-400 mt-1">
                {isLogin ? 'Sign in to access document intelligent chat' : 'Create an account to start analyzing documents'}
              </p>
            </div>

            {error && (
              <div className="mb-4 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded text-xs text-red-600 dark:text-red-400">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              {!isLogin && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-medium mb-1 text-neutral-700 dark:text-neutral-300">First Name</label>
                      <input required name="first_name" value={formData.first_name} onChange={handleChange}
                        className="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500" />
                    </div>
                    <div>
                      <label className="block font-medium mb-1 text-neutral-700 dark:text-neutral-300">Last Name</label>
                      <input required name="last_name" value={formData.last_name} onChange={handleChange}
                        className="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-medium mb-1 text-neutral-700 dark:text-neutral-300">Username</label>
                    <input required name="username" value={formData.username} onChange={handleChange}
                      className="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500" />
                  </div>
                </>
              )}

              <div>
                <label className="block font-medium mb-1 text-neutral-700 dark:text-neutral-300">Email Address</label>
                <input required type="email" name="email" value={formData.email} onChange={handleChange}
                  className="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500" />
              </div>

              <div>
                <label className="block font-medium mb-1 text-neutral-700 dark:text-neutral-300">Password</label>
                <input required type="password" name="password" value={formData.password} onChange={handleChange} placeholder={!isLogin ? "Min. 8 characters" : ""}
                  className="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500" />
              </div>

              <button type="submit" disabled={loading}
                className="w-full bg-neutral-900 hover:bg-neutral-800 dark:bg-neutral-100 dark:hover:bg-neutral-200 text-white dark:text-neutral-900 font-medium py-2 px-4 rounded transition-colors disabled:opacity-50">
                {loading ? 'Processing...' : isLogin ? 'Sign In' : 'Create Account'}
              </button>
            </form>

            <div className="mt-6 pt-4 border-t border-neutral-200 dark:border-neutral-800 text-center text-xs text-neutral-500">
              {isLogin ? "Don't have an account? " : "Already registered? "}
              <button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="text-neutral-900 dark:text-neutral-200 font-medium hover:underline">
                {isLogin ? 'Register' : 'Sign in'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MAIN DASHBOARD (LAYOUT + MANAGEMENT)
    function MainDashboard({ user, onLogout, toggleTheme, theme, showToast }) {
      const [documents, setDocuments] = useState([]);
      const [documentsLoading, setDocumentsLoading] = useState(true);
      const [sessionId, setSessionId] = useState(() => getSessionId());
      const [selectedDocIds, setSelectedDocIds] = useState([]);
      const [activeTab, setActiveTab] = useState('chat'); // Mobile tab toggle: 'documents' | 'chat' | 'admin'
      const [isAdminViewOpen, setIsAdminViewOpen] = useState(false);

      // Fetch Documents
      const fetchDocuments = useCallback(async () => {
        try {
          const res = await apiFetch('/documents/');
          if (res.ok) {
            const data = await res.json();
            // Sort newest first
            data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            setDocuments(data);
          }
        } catch (err) {
          showToast('Failed to load document library');
        } finally {
          setDocumentsLoading(false);
        }
      }, []);

      // Realtime Status (WebSocket + Exponential Backoff Polling Fallback)
      useEffect(() => {
        fetchDocuments();

        let ws = null;
        let retryCount = 0;
        let pollInterval = null;
        let isComponentMounted = true;

        const startPolling = () => {
          if (!pollInterval && isComponentMounted) {
            pollInterval = setInterval(() => {
              fetchDocuments();
            }, 5000);
          }
        };

        const stopPolling = () => {
          if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
          }
        };

        const connectWS = () => {
          const token = getToken();
          if (!token || retryCount >= 5) {
            startPolling();
            return;
          }

          ws = new WebSocket(`${WS_BASE_URL}/documents/ws?token=${token}`);

          ws.onopen = () => {
            retryCount = 0;
            stopPolling();
          };

          ws.onmessage = () => {
            fetchDocuments();
          };

          ws.onerror = () => {
            ws.close();
          };

          ws.onclose = () => {
            if (!isComponentMounted) return;
            retryCount++;
            if (retryCount >= 5) {
              startPolling();
            } else {
              // Exponential backoff 1s, 2s, 4s, 8s, 16s (max 30s)
              const timeout = Math.min(Math.pow(2, retryCount - 1) * 1000, 30000);
              setTimeout(connectWS, timeout);
            }
          };
        };

        connectWS();

        return () => {
          isComponentMounted = false;
          if (ws) ws.close();
          stopPolling();
        };
      }, [fetchDocuments]);

      // Load session document scope whenever sessionId changes
      useEffect(() => {
        const fetchSessionDocs = async () => {
          try {
            const res = await apiFetch(`/chat/sessions/${sessionId}/documents`);
            if (res.ok) {
              const data = await res.json();
              setSelectedDocIds(data.document_ids || []);
            }
          } catch (e) {
            // fallback gracefully
          }
        };
        fetchSessionDocs();
      }, [sessionId]);

      // Update session document scope
      const handleToggleDocScope = async (docId) => {
        const newDocIds = selectedDocIds.includes(docId)
          ? selectedDocIds.filter(id => id !== docId)
          : [...selectedDocIds, docId];

        setSelectedDocIds(newDocIds);

        try {
          await apiFetch(`/chat/sessions/${sessionId}/documents`, {
            method: 'PUT',
            body: JSON.stringify({ document_ids: newDocIds })
          });
        } catch (e) {
          showToast('Failed to update session context scoping');
        }
      };

      const handleStartNewSession = () => {
        const newSid = crypto.randomUUID ? crypto.randomUUID() : 'session_' + Math.random().toString(36).substring(2);
        localStorage.setItem('chat_session_id', newSid);
        setSessionId(newSid);
        setSelectedDocIds([]);
      };

      const handleDeleteDocument = async (docId) => {
        if (!confirm('Are you sure you want to delete this document?')) return;
        try {
          const res = await apiFetch(`/documents/${docId}`, { method: 'DELETE' });
          if (res.ok) {
            setDocuments(prev => prev.filter(d => d.id !== docId));
            if (selectedDocIds.includes(docId)) {
              handleToggleDocScope(docId);
            }
          } else {
            showToast('Failed to delete document');
          }
        } catch (e) {
          showToast('Network error on delete request');
        }
      };

      const handleReprocessDocument = async (docId) => {
        try {
          const res = await apiFetch(`/documents/admin/reprocess/${docId}`, { method: 'POST' });
          if (res.ok) {
            showToast('Document scheduled for reprocessing', 'info');
            fetchDocuments();
          } else {
            showToast('Failed to trigger reprocessing');
          }
        } catch (e) {
          showToast('Error sending reprocess command');
        }
      };

      return (
        <div className="flex flex-col h-full overflow-hidden">
          {/* HEADER BAR */}
          <header className="h-12 border-b border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 flex items-center justify-between shrink-0">
            <div className="flex items-center space-x-3">
              <span className="font-semibold text-sm tracking-tight">DocQuery AI</span>
              <span className="text-xs px-2 py-0.5 rounded bg-neutral-100 dark:bg-neutral-800 text-neutral-500 font-mono">
                {sessionId.slice(0, 8)}
              </span>
            </div>

            <div className="flex items-center space-x-2 text-xs">
              {user.role === 'admin' && (
                <button
                  onClick={() => setIsAdminViewOpen(!isAdminViewOpen)}
                  className={`px-2.5 py-1 rounded transition-colors ${isAdminViewOpen ? 'bg-neutral-200 dark:bg-neutral-700 font-medium' : 'hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-600 dark:text-neutral-400'}`}
                >
                  Admin Portal
                </button>
              )}
              <button onClick={toggleTheme} className="p-1.5 rounded hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-600 dark:text-neutral-400">
                {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
              </button>
              <div className="h-4 w-[1px] bg-neutral-200 dark:bg-neutral-800"></div>
              <span className="text-neutral-500 hidden sm:inline">{user.email}</span>
              <button onClick={onLogout} className="text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-100 font-medium">
                Logout
              </button>
            </div>
          </header>

          {/* MAIN TWO-PANE BODY */}
          <div className="flex-1 flex overflow-hidden relative">
            {isAdminViewOpen ? (
              <AdminPanel onClose={() => setIsAdminViewOpen(false)} showToast={showToast} />
            ) : (
              <>
                {/* LEFT SIDEBAR: DOCUMENTS */}
                <div className={`w-full md:w-80 lg:w-96 border-r border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900/50 flex flex-col shrink-0 ${activeTab === 'documents' ? 'flex' : 'hidden md:flex'}`}>
                  <SidebarContent
                    documents={documents}
                    loading={documentsLoading}
                    selectedDocIds={selectedDocIds}
                    onToggleScope={handleToggleDocScope}
                    onDelete={handleDeleteDocument}
                    onReprocess={handleReprocessDocument}
                    onUploadSuccess={fetchDocuments}
                    userRole={user.role}
                    showToast={showToast}
                  />
                </div>

                {/* MAIN PANE: CHAT */}
                <div className={`flex-1 bg-neutral-50 dark:bg-neutral-950 flex flex-col min-w-0 ${activeTab === 'chat' ? 'flex' : 'hidden md:flex'}`}>
                  <ChatPane
                    sessionId={sessionId}
                    selectedDocIds={selectedDocIds}
                    onNewSession={handleStartNewSession}
                    showToast={showToast}
                  />
                </div>
              </>
            )}
          </div>

          {/* MOBILE NAVIGATION BAR */}
          {!isAdminViewOpen && (
            <div className="md:hidden flex border-t border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 text-xs">
              <button
                onClick={() => setActiveTab('documents')}
                className={`flex-1 py-3 text-center font-medium ${activeTab === 'documents' ? 'text-neutral-900 dark:text-neutral-100 border-t-2 border-neutral-900 dark:border-neutral-100' : 'text-neutral-500'}`}
              >
                Documents ({documents.length})
              </button>
              <button
                onClick={() => setActiveTab('chat')}
                className={`flex-1 py-3 text-center font-medium ${activeTab === 'chat' ? 'text-neutral-900 dark:text-neutral-100 border-t-2 border-neutral-900 dark:border-neutral-100' : 'text-neutral-500'}`}
              >
                Chat Workspace
              </button>
            </div>
          )}
        </div>
      );
    }

    // SIDEBAR: UPLOAD & DOCUMENT LIST
    function SidebarContent({ documents, loading, selectedDocIds, onToggleScope, onDelete, onReprocess, onUploadSuccess, userRole, showToast }) {
      const [isUploading, setIsUploading] = useState(false);
      const [dragActive, setDragActive] = useState(false);
      const fileInputRef = useRef(null);

      const handleFiles = async (files) => {
        if (!files || files.length === 0) return;
        const file = files[0];

        if (file.type !== 'application/pdf') {
          showToast('Invalid file format. Only PDF files are allowed.');
          return;
        }

        if (file.size > 25 * 1024 * 1024) {
          showToast('File size exceeds the max limit of 25MB.');
          return;
        }

        setIsUploading(true);
        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await apiFetch('/documents/', {
            method: 'POST',
            body: formData,
          });

          if (res.status === 201) {
            onUploadSuccess();
          } else {
            const errData = await res.json();
            showToast(errData.detail || errData.message || 'Upload rejected by server');
          }
        } catch (err) {
          showToast('Network error during file upload');
        } finally {
          setIsUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      return (
        <div className="flex flex-col h-full">
          {/* UPLOAD ZONE */}
          <div className="p-4 border-b border-neutral-200 dark:border-neutral-800">
            <div
              onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
              onDragLeave={() => setDragActive(false)}
              onDrop={(e) => { e.preventDefault(); setDragActive(false); handleFiles(e.dataTransfer.files); }}
              onClick={() => fileInputRef.current?.click()}
              className={`border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-colors ${
                dragActive ? 'border-neutral-500 bg-neutral-100 dark:bg-neutral-800' : 'border-neutral-300 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-700'
              }`}
            >
              <input ref={fileInputRef} type="file" accept="application/pdf" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
              {isUploading ? (
                <div className="flex items-center justify-center space-x-2 text-xs text-neutral-500">
                  <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                  </svg>
                  <span>Processing & uploading...</span>
                </div>
              ) : (
                <div className="space-y-1">
                  <div className="text-xs font-medium text-neutral-700 dark:text-neutral-300">
                    Click to upload or drag PDF
                  </div>
                  <div className="text-[10px] text-neutral-400">PDF up to 25MB</div>
                </div>
              )}
            </div>
          </div>

          {/* DOCUMENT LIST */}
          <div className="flex-1 overflow-y-auto p-3 space-y-2">
            <div className="text-[11px] font-medium uppercase tracking-wider text-neutral-400 px-2 py-1 flex justify-between items-center">
              <span>Library</span>
              <span>{documents.length} files</span>
            </div>

            {loading ? (
              <div className="text-center py-8 text-xs text-neutral-400">Loading documents...</div>
            ) : documents.length === 0 ? (
              <div className="text-center py-8 px-4 text-xs text-neutral-500">
                No documents uploaded yet. Add a PDF to begin workspace grounding.
              </div>
            ) : (
              documents.map((doc) => (
                <DocumentItem
                  key={doc.id}
                  doc={doc}
                  isScoped={selectedDocIds.includes(doc.id)}
                  onToggleScope={() => onToggleScope(doc.id)}
                  onDelete={() => onDelete(doc.id)}
                  onReprocess={() => onReprocess(doc.id)}
                  userRole={userRole}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // DOCUMENT ITEM ROW COMPONENT
    function DocumentItem({ doc, isScoped, onToggleScope, onDelete, onReprocess, userRole }) {
      const getStatusBadge = (status) => {
        switch (status) {
          case 'processed':
            return <span className="inline-block w-2 h-2 rounded-full bg-emerald-500" title="Processed"></span>;
          case 'processing':
            return <span className="inline-block w-2 h-2 rounded-full bg-blue-500 animate-ping" title="Processing"></span>;
          case 'failed':
            return <span className="inline-block w-2 h-2 rounded-full bg-red-500" title="Failed"></span>;
          default:
            return <span className="inline-block w-2 h-2 rounded-full bg-neutral-400" title="Pending"></span>;
        }
      };

      return (
        <div className={`group relative flex items-start space-x-3 p-2.5 rounded-lg border transition-colors ${
          isScoped ? 'bg-neutral-100/80 dark:bg-neutral-800/60 border-neutral-300 dark:border-neutral-700' : 'bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-800'
        }`}>
          <input
            type="checkbox"
            checked={isScoped}
            onChange={onToggleScope}
            className="mt-1 rounded border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 text-neutral-900 focus:ring-0"
            title="Scope chat query to this document"
          />

          <div className="flex-1 min-w-0">
            <div className="flex items-center space-x-2">
              {getStatusBadge(doc.status)}
              <span className="text-xs font-medium truncate text-neutral-800 dark:text-neutral-200" title={doc.filename}>
                {doc.filename}
              </span>
            </div>

            <div className="mt-1 flex items-center space-x-2 text-[10px] text-neutral-500">
              {doc.page_count !== null && <span>{doc.page_count} pages</span>}
              {doc.chunk_count !== null && <span>• {doc.chunk_count} chunks</span>}
              <span className="capitalize">• {doc.status}</span>
            </div>

            {doc.status === 'failed' && doc.error_message && (
              <div className="mt-1 text-[10px] text-red-500 truncate" title={doc.error_message}>
                Error: {doc.error_message}
              </div>
            )}
          </div>

          <div className="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
            {doc.status === 'failed' && userRole === 'admin' && (
              <button onClick={onReprocess} className="text-[10px] text-blue-500 hover:underline px-1 py-0.5">
                Retry
              </button>
            )}
            <button onClick={onDelete} className="text-neutral-400 hover:text-red-500 p-1 text-xs">
              ✕
            </button>
          </div>
        </div>
      );
    }

    // CHAT PANE
    function ChatPane({ sessionId, selectedDocIds, onNewSession, showToast }) {
      const [messages, setMessages] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(true);
      const [inputQuery, setInputQuery] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      // Load History on Session Change
      useEffect(() => {
        const fetchHistory = async () => {
          setLoadingHistory(true);
          try {
            const res = await apiFetch(`/chat/sessions/${sessionId}/history`);
            if (res.ok) {
              const data = await res.json();
              const formatted = [];
              (data.history || []).forEach(item => {
                formatted.push({ sender: 'user', text: item.question });
                formatted.push({ sender: 'assistant', text: item.answer, sources: [], cached: false });
              });
              setMessages(formatted);
            }
          } catch (e) {
            showToast('Failed to load query history');
          } finally {
            setLoadingHistory(false);
          }
        };

        fetchHistory();
      }, [sessionId]);

      useEffect(() => {
        scrollToBottom();
      }, [messages, isStreaming]);

      // Stream Submit Handling
      const handleSend = async (e) => {
        e?.preventDefault();
        if (!inputQuery.trim() || isStreaming) return;

        const question = inputQuery.trim();
        setInputQuery('');

        // Append user query and empty assistant placeholder
        setMessages(prev => [
          ...prev,
          { sender: 'user', text: question },
          { sender: 'assistant', text: '', sources: [], cached: false, isError: false }
        ]);

        setIsStreaming(true);

        try {
          const token = getToken();
          const response = await fetch(`${API_BASE_URL}/chat/query/stream`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              session_id: sessionId,
              question: question,
              top_k: 5,
              document_ids: selectedDocIds.length > 0 ? selectedDocIds : null
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error status: ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop(); // keep last incomplete chunk

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data:')) {
                const jsonStr = trimmed.replace(/^data:\s*/, '');
                if (!jsonStr) continue;

                try {
                  const data = JSON.parse(jsonStr);

                  if (data.type === 'sources') {
                    setMessages(prev => {
                      const updated = [...prev];
                      const last = updated[updated.length - 1];
                      last.sources = data.sources || [];
                      return updated;
                    });
                  } else if (data.type === 'delta') {
                    setMessages(prev => {
                      const updated = [...prev];
                      const last = updated[updated.length - 1];
                      last.text += data.text || '';
                      return updated;
                    });
                  } else if (data.type === 'done') {
                    setMessages(prev => {
                      const updated = [...prev];
                      const last = updated[updated.length - 1];
                      last.cached = !!data.cached;
                      return updated;
                    });
                  } else if (data.type === 'error') {
                    setMessages(prev => {
                      const updated = [...prev];
                      const last = updated[updated.length - 1];
                      last.text += `\n[Error: ${data.message}]`;
                      last.isError = true;
                      return updated;
                    });
                  }
                } catch (e) {
                  console.error('Failed to parse SSE JSON payload', e);
                }
              }
            }
          }
        } catch (err) {
          setMessages(prev => {
            const updated = [...prev];
            const last = updated[updated.length - 1];
            last.text = `Error streaming response: ${err.message}`;
            last.isError = true;
            return updated;
          });
        } finally {
          setIsStreaming(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      return (
        <div className="flex flex-col h-full relative">
          {/* TOP BAR / SCOPE SUMMARY */}
          <div className="h-10 border-b border-neutral-200 dark:border-neutral-800 px-4 flex items-center justify-between bg-white dark:bg-neutral-900/30 text-xs">
            <div className="text-neutral-500 truncate">
              Context Scope: {selectedDocIds.length === 0 ? (
                <span className="italic">All processed library documents</span>
              ) : (
                <span className="font-medium text-neutral-800 dark:text-neutral-200">{selectedDocIds.length} file(s) selected</span>
              )}
            </div>
            <button
              onClick={onNewSession}
              className="text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 font-medium"
            >
              + New Session
            </button>
          </div>

          {/* MESSAGES LIST */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {loadingHistory ? (
              <div className="text-center py-12 text-xs text-neutral-400">Loading conversation history...</div>
            ) : messages.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-center py-12">
                <div className="w-10 h-10 rounded-full bg-neutral-200 dark:bg-neutral-800 flex items-center justify-center mb-3 text-neutral-500">
                  💬
                </div>
                <div className="text-sm font-medium text-neutral-700 dark:text-neutral-300">Document Intelligence Chat</div>
                <div className="text-xs text-neutral-400 max-w-sm mt-1">
                  Ask questions to query synthesized facts, grounded citations, and extract insights directly from your uploaded files.
                </div>
              </div>
            ) : (
              messages.map((msg, index) => (
                <ChatMessage key={index} message={msg} />
              ))
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* CHAT INPUT AREA */}
          <div className="p-4 border-t border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900">
            <form onSubmit={handleSend} className="relative">
              <textarea
                value={inputQuery}
                onChange={(e) => setInputQuery(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Ask anything about your documents... (Press Enter to send, Shift+Enter for newline)"
                rows={2}
                disabled={isStreaming}
                className="w-full pl-3 pr-12 py-2.5 bg-neutral-50 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded-lg text-xs focus:outline-none focus:border-neutral-500 dark:focus:border-neutral-500 resize-none"
              />
              <button
                type="submit"
                disabled={isStreaming || !inputQuery.trim()}
                className="absolute right-2.5 bottom-3 px-3 py-1 bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 rounded text-xs font-medium disabled:opacity-30 transition-opacity"
              >
                {isStreaming ? '...' : 'Send'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // SINGLE CHAT MESSAGE BUBBLE & SOURCES
    function ChatMessage({ message }) {
      const isUser = message.sender === 'user';
      const [showSources, setShowSources] = useState(false);

      return (
        <div className={`flex flex-col ${isUser ? 'items-end' : 'items-start'}`}>
          <div className={`max-w-3xl rounded-lg px-4 py-3 text-xs leading-relaxed ${
            isUser
              ? 'bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900'
              : message.isError
              ? 'bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400'
              : 'bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 text-neutral-800 dark:text-neutral-200 shadow-sm'
          }`}>
            <div className="whitespace-pre-wrap">{message.text || (!isUser && <span className="animate-pulse text-neutral-400">Thinking...</span>)}</div>

            {message.cached && (
              <span className="inline-block mt-2 text-[9px] uppercase px-1.5 py-0.5 rounded bg-neutral-100 dark:bg-neutral-800 text-neutral-500 font-mono">
                Cached Answer
              </span>
            )}
          </div>

          {/* CITATION SOURCES */}
          {!isUser && message.sources && message.sources.length > 0 && (
            <div className="mt-1.5 max-w-3xl w-full">
              <button
                onClick={() => setShowSources(!showSources)}
                className="text-[10px] text-neutral-500 hover:text-neutral-800 dark:hover:text-neutral-300 flex items-center space-x-1"
              >
                <span>{showSources ? '▼ Hide' : '▶ Show'} {message.sources.length} Grounded Sources</span>
              </button>

              {showSources && (
                <div className="mt-2 space-y-1.5 pl-2 border-l-2 border-neutral-300 dark:border-neutral-700">
                  {message.sources.map((src, i) => (
                    <div key={i} className="text-[10px] bg-neutral-100 dark:bg-neutral-900/60 p-2 rounded border border-neutral-200 dark:border-neutral-800">
                      <div className="font-mono text-neutral-500 flex justify-between mb-1">
                        <span>Doc ID: {src.document_id.slice(0, 8)}... (Chunk #{src.chunk_index})</span>
                        {src.score !== undefined && <span>Score: {Number(src.score).toFixed(3)}</span>}
                      </div>
                      <div className="text-neutral-700 dark:text-neutral-300 italic line-clamp-3 font-serif">
                        "{src.text}"
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ADMIN PORTAL COMPONENT
    function AdminPanel({ onClose, showToast }) {
      const [users, setUsers] = useState([]);
      const [queueStats, setQueueStats] = useState(null);
      const [loading, setLoading] = useState(true);

      const fetchAdminData = useCallback(async () => {
        try {
          const [usersRes, queueRes] = await Promise.all([
            apiFetch('/auth/users'),
            apiFetch('/documents/admin/queue')
          ]);

          if (usersRes.ok) setUsers(await usersRes.json());
          if (queueRes.ok) setQueueStats(await queueRes.json());
        } catch (e) {
          showToast('Failed to load admin panel details');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchAdminData();
        const interval = setInterval(fetchAdminData, 10000); // Poll queue status every 10s
        return () => clearInterval(interval);
      }, [fetchAdminData]);

      return (
        <div className="flex-1 bg-white dark:bg-neutral-950 p-6 overflow-y-auto">
          <div className="flex justify-between items-center mb-6 border-b border-neutral-200 dark:border-neutral-800 pb-4">
            <div>
              <h2 className="text-lg font-semibold tracking-tight">Admin System Telemetry</h2>
              <p className="text-xs text-neutral-500">Monitor queue metrics and inspect registered system users.</p>
            </div>
            <button onClick={onClose} className="px-3 py-1.5 bg-neutral-100 dark:bg-neutral-800 rounded text-xs hover:bg-neutral-200 dark:hover:bg-neutral-700">
              Close Panel
            </button>
          </div>

          {loading ? (
            <div className="text-xs text-neutral-400">Loading system metrics...</div>
          ) : (
            <div className="space-y-6">
              {/* QUEUE METRICS */}
              <div>
                <h3 className="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-3">Processing Queue Status</h3>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="p-4 rounded-lg bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800">
                    <div className="text-xs text-neutral-500">Pending Tasks</div>
                    <div className="text-2xl font-bold mt-1">{queueStats?.pending_in_queue ?? 0}</div>
                  </div>
                  <div className="p-4 rounded-lg bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800">
                    <div className="text-xs text-neutral-500">Active Tasks</div>
                    <div className="text-2xl font-bold mt-1 text-blue-500">{queueStats?.active_tasks ?? 0}</div>
                  </div>
                  <div className="p-4 rounded-lg bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800">
                    <div className="text-xs text-neutral-500">Reserved Tasks</div>
                    <div className="text-2xl font-bold mt-1">{queueStats?.reserved_tasks ?? 0}</div>
                  </div>
                  <div className="p-4 rounded-lg bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800">
                    <div className="text-xs text-neutral-500">Workers Online</div>
                    <div className="text-2xl font-bold mt-1 text-emerald-500">
                      {queueStats?.workers_online ? queueStats.workers_online.length : 0}
                    </div>
                  </div>
                </div>
              </div>

              {/* USER MANAGEMENT */}
              <div>
                <h3 className="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-3">Registered Users</h3>
                <div className="border border-neutral-200 dark:border-neutral-800 rounded-lg overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-neutral-50 dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 text-neutral-500 font-medium">
                      <tr>
                        <th className="p-3">User</th>
                        <th className="p-3">Email</th>
                        <th className="p-3">Role</th>
                        <th className="p-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-neutral-200 dark:divide-neutral-800">
                      {users.map((u) => (
                        <tr key={u.id}>
                          <td className="p-3 font-medium">{u.first_name} {u.last_name} ({u.username})</td>
                          <td className="p-3 text-neutral-500">{u.email}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] uppercase font-mono ${u.role === 'admin' ? 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-400'}`}>
                              {u.role}
                            </span>
                          </td>
                          <td className="p-3">
                            <span className={u.is_active ? 'text-emerald-500' : 'text-neutral-400'}>
                              {u.is_active ? 'Active' : 'Inactive'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // MOUNT APPLICATION
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
